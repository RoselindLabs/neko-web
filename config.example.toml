[plugin]
enabled = false
config_version = "1.0.0"

[web]
search_provider = "anysearch" # anysearch / exa
manual_search_provider = "configured" # configured / jina_serp；只覆盖手动普通/批量搜索，Life后台沿用上项
jina_search_engine = "google" # google / bing，核对返回引擎，不自动换源
jina_proxy_url = "" # 可选Jina专用代理；留空沿用下方代理，不影响Exa/Firecrawl/Life
extract_provider = "anysearch" # anysearch / firecrawl / jina，不自动切换
exa_api_key = ""
firecrawl_api_key = ""
jina_api_key = "" # 可留空匿名，仅选jina时使用；供应商额度/收费自行管理

# AnySearch API Key（可选；留空使用匿名访问）
api_key = ""

# 单次请求超时时间（秒）
timeout_seconds = 30

# 搜索默认返回条数，范围 1-10
default_max_results = 5

# 代理模式：none（不使用代理）、system（使用系统代理）、custom（使用下方代理地址）
proxy_mode = "none"

# 自定义代理地址，仅在 proxy_mode = "custom" 时生效
proxy_url = ""

# 每批最多给模型预览的图片数量，范围 1-4；可翻页，不是发送配额
max_images = 4

# 单张网络图片的大小上限，单位 MB，范围 1-8
max_image_megabytes = 8

# 打开网页时返回的正文上限
max_text_chars = 8000

[weather]
enabled = false # 单独授权的按需查询；没有后台轮询/主动播报
location_name = "" # 显示名称；不根据名称或IP自动查坐标
latitude = 0.0 # WGS84纬度：须由管理员填真实公共地点坐标，北纬正
longitude = 0.0 # WGS84经度：东经正；时间固定按北京时间呈现
